<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — SecureVault</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00d4d4">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060d1a;
      color: #fff;
      font-family: "Segoe UI", Inter, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 2rem;
    }
    .container { max-width: 360px; }
    .icon-wrap {
      width: 96px; height: 96px; margin: 0 auto 1.5rem;
      background: rgba(0,212,212,.08);
      border: 1.5px solid rgba(0,212,212,.2);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem;
    }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: .5rem; color: #f1f5f9; }
    p  { color: rgba(255,255,255,.5); font-size: .875rem; line-height: 1.6; margin-bottom: 1.75rem; }
    .btn {
      display: inline-block; padding: .85rem 2.5rem;
      background: linear-gradient(135deg, #00c8c8, #4f46e5);
      border: none; border-radius: 12px;
      color: #fff; font-weight: 700; font-size: .95rem;
      cursor: pointer; text-decoration: none;
      box-shadow: 0 4px 20px rgba(0,200,200,.3);
      transition: opacity .2s, transform .2s;
    }
    .btn:hover { opacity: .9; transform: translateY(-1px); }
    .status {
      margin-top: 1.5rem;
      font-size: .75rem; color: rgba(255,255,255,.25);
    }
    .status span { color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrap">📡</div>
    <h1>You're Offline</h1>
    <p>
      SecureVault needs an internet connection to load your files and data.
      Please check your connection and try again.
    </p>
    <button class="btn" onclick="tryReconnect()">Try Again</button>
    <div class="status">
      Status: <span id="status-text">No connection</span>
    </div>
  </div>

  <script>
    function tryReconnect() {
      document.getElementById('status-text').textContent = 'Checking…';
      fetch('/login', { method: 'HEAD', cache: 'no-store' })
        .then(() => window.location.href = '/')
        .catch(() => {
          document.getElementById('status-text').textContent = 'Still offline';
          setTimeout(() => {
            document.getElementById('status-text').textContent = 'No connection';
          }, 2000);
        });
    }

    // Auto-retry when connection returns
    window.addEventListener('online', () => {
      document.getElementById('status-text').textContent = 'Reconnected!';
      setTimeout(() => window.location.href = '/', 800);
    });
  </script>
</body>
</html>
