server {
    listen 80;
    server_name localhost;          # Change to your domain in production

    client_max_body_size 110M;      # Slightly above Flask's 100M limit

    # Serve static files directly via Nginx (faster than Flask)
    location /static/ {
        alias /path/to/securevault/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy everything else to Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
